<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#152537">
<title>Python 期末速成｜原题练习</title>
<style>
:root{color-scheme:light;--ink:#152537;--muted:#526478;--accent:#195a82;--line:#d7e0e7;background:#f1f5f7;color:var(--ink);font:16px/1.6 "Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0}
main{width:min(960px,calc(100% - 36px));margin:32px auto 48px}
h1,h2,p{margin:0}
h1{font-size:clamp(29px,5vw,43px);line-height:1.2;font-weight:760;letter-spacing:-.035em}
.controls{display:flex;gap:12px 20px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:23px 0 16px}
.banks{display:flex;gap:8px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--ink)}
button,select,input{min-height:40px;border:1px solid #aebfcd;border-radius:7px;background:#fff;padding:6px 12px}
button{cursor:pointer}
button:hover:not(:disabled){background:#e3eef6;border-color:#6893ad}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button[aria-pressed="true"]:hover{background:#164c6e}
button:disabled{cursor:default;opacity:.45}
a{color:var(--accent)}
:focus-visible{outline:3px solid #b96b0c;outline-offset:2px}
.jump{display:flex;gap:6px;align-items:center}
.jump input{width:10ch}
#jump-error{color:#a13422;margin:0 0 12px}
#jump-error:empty{display:none}
.learning-path{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 16px}
.mode-switch{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.learning-path label{font-weight:700}
.learning-path select{max-width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:clamp(13px,3vw,26px);box-shadow:0 7px 20px #223e5310}
.meta{display:flex;justify-content:space-between;align-items:start;gap:9px 16px;flex-wrap:wrap}
h2{font-size:clamp(21px,4vw,27px);line-height:1.35}
#topic{color:var(--muted);margin-top:3px}
#counter{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.figure{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin:8px 0}
.figure a{display:block}
.figure img{display:block;width:100%;height:auto}
.zoom-hint{font-size:.85rem;color:var(--muted)}
.analysis{margin-top:17px;padding:10px 14px;border:1px solid #b7cbda;border-radius:8px;background:#f3f8fb}
summary{cursor:pointer;color:#184c6d;font-weight:700}
.lesson pre{margin:6px 0 10px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto;font: .9rem/1.5 ui-monospace,Consolas,monospace}
.lesson pre code{background:none;padding:0;font:inherit}
.example{margin:12px 0 0}
.example p{margin:4px 0;font-size:.9rem}
.example-output{white-space:pre-wrap}
#repeat-note{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);margin-top:9px;font-size:.9rem}
.reference{margin-top:10px}
.lesson h3{font-size:1rem;margin:12px 0 4px}
.lesson p,.lesson li{overflow-wrap:anywhere}
.lesson #reasoning p+p{margin-top:6px}
.lesson code{font: .94em/1.5 ui-monospace,Consolas,monospace;background:#e6eff5;color:#173e59;border-radius:3px;padding:0 .2em}
#source-mark{margin-top:10px;color:var(--muted);font-size:.9rem}
.navigation{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:16px 0}
#pick{max-width:54%}
[hidden]{display:none!important}
@media(max-width:650px){main{width:calc(100% - 24px);margin-top:19px}.figure img{min-width:530px}.figure.program img{min-width:680px}.controls{align-items:center}.jump input{width:9ch}}
</style>
</head>
<body>
<main>
  <h1>Python 期末速成</h1>
  <div class="mode-switch" role="group" aria-label="练习范围">
    <button type="button" data-mode="quick" aria-pressed="true">速成路线</button>
    <button type="button" data-mode="all" aria-pressed="false">全部原题</button>
  </div>
  <div class="controls">
    <div class="banks" aria-label="选择题库">
      <button type="button" data-bank="choice" aria-pressed="true">选择题 · 282 道</button>
      <button type="button" data-bank="program" aria-pressed="false">程序题 · 67 道</button>
    </div>
    <form class="jump" id="jump">
      <label for="number">题号</label>
      <input id="number" autocomplete="off" type="search" placeholder="如 72">
      <button type="submit">跳转</button>
    </form>
  </div>
  <p id="jump-error" role="status"></p>
  <div class="learning-path" id="learning-path">
    <label for="chapter">当前主题</label>
    <select id="chapter"></select>
  </div>
  <article class="card" aria-labelledby="title">
    <div class="meta">
      <div>
        <h2 id="title" tabindex="-1">选择题</h2>
        <p id="topic"></p>
      </div>
      <p id="counter" aria-live="polite"></p>
    </div>
    <p id="repeat-note" hidden>速成路线练这道同类题：<button id="repeat-target" type="button"></button></p>
    <span class="zoom-hint">点题图可放大</span>
    <div id="question"></div>
    <details id="analysis" class="analysis">
      <summary>展开解析</summary>
      <div class="lesson">
        <h3>先认写法</h3>
        <p id="prerequisite"></p>
        <h3 id="reasoning-label">怎么做</h3>
        <div id="reasoning"></div>
        <details id="example" class="example" hidden>
          <summary>看一小段代码</summary>
          <pre><code id="example-code"></code></pre>
          <p id="example-input" hidden></p>
          <p class="example-output" id="example-output"></p>
        </details>
      </div>
      <p id="source-mark" hidden></p>
      <details id="reference" class="reference">
        <summary>查看题库参考代码</summary>
        <div id="answer"></div>
      </details>
    </details>
  </article>
  <nav class="navigation" aria-label="切换题目">
    <button type="button" id="previous">上一题</button>
    <select id="pick" aria-label="题号列表"></select>
    <button type="button" id="next">下一题</button>
  </nav>
  <noscript>网页需要允许 JavaScript 才能在页面中切换题目。</noscript>
</main>

:[{"src":"exam-images/choice-14-question-1.webp","page":3,"width":1070,"height":289,"text":"第14题\n下面代码的输出结果是（）。\nhex(255)\n(A)'0bff'\n(B)'0xff'\n(C)'0off'\n(D)'0eff'"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"15","topic":"进制表示与转换","question":[{"src":"exam-images/choice-15-question-1.webp","page":3,"width":1070,"height":328,"text":"第15题\n下面代码的输出结果是\nx = 0x0101\nprint (x)\n(A) 257\n(B) 65\n(C) 5\n(D) 101"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"16","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-16-question-1.webp","page":3,"width":1070,"height":523,"text":"第16题\n下面代码的输出结果是\ndef change (a,b):\na = 10\nb += a\na = 4\nb = 5\nchange (a,b)\nprint (a,b)\n(A) 10 5\n(B) 4 5\n(C) 4 15\n(D) 10 15"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"17","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-17-question-1.webp","page":3,"width":1070,"height":172,"text":"第17题\n下面代码实现的功能描述为\ndef fact (n):\nif n == 0:"},{"src":"exam-images/choice-17-question-2.webp","page":4,"width":1070,"height":367,"text":"return 1\nelse:\nreturn n*fact (n - 1)\nnum = eval (input (\"请输入一个整数：\"))\nprint (fact (abs (int (num))))\n(A) 接受用户输入的整数 N，判断 N 是否是素数并输出结论\n(B) 接受用户输入的整数 N，输出 N 的阶乘值\n(C) 接受用户输入的整数 N，判断 N 是否是完数并输出结论\n(D) 接受用户输入的整数 N，判断 N 是否是水仙花数"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"18","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-18-question-1.webp","page":4,"width":1070,"height":445,"text":"第18题\n以下代码的输出结果是\ndef fun1 (a):\na = 10\nb = 2\nfun1 (b)\nprint (b)\n(A) 10\n(B) 2\n(C) TRUE\n(D) FALSE"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"19","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-19-question-1.webp","page":4,"width":1070,"height":367,"text":"第19题\n下面代码的执行结果是（）。\ndef area (r, pi = 3.14159):\nreturn pi * r * r\narea (3.14, 4)\n(A) 50.24\n(B) 出错\n(C) 39.4384\n(D) 无输出"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"20","topic":"定义、位置参数与关键字参数","question":[ -images/choice-123-question-1.webp","page":29,"width":1070,"height":328,"text":"第123题\n下面代码的输出结果是\nname = \"Python 语言程序设计\"\nprint (name [2: -2])\n(A) ython 语言程序设\n(B) thon 语言程序设\n(C) thon 语言程序\n(D) ython 语言程序"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"124","topic":"输入、表达式求值与报错","question":[{"src":"exam-images/choice-124-question-1.webp","page":29,"width":1070,"height":289,"text":"第124题\n关于 eval 函数，以下选项中描述错误的是\n(A) 执行 “>>> eval ('Hello')” 和执行 “>>> eval (\"'Hello'\")” 得到相同的结果\n(B) 如果用户希望输入一个数字，并用程序对这个数字进行计算，可以采用 eval (input (\u003c 输\n入提示字符串 >)) 组合\n(C) eval 函数的作用是将输入的字符串转为 Python 语句，并执行该语句\n(D) eval 函数的定义为：eval (source, globals=None, locals=None, /)"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"125","topic":"元组与解包","question":[{"src":"exam-images/choice-125-question-1.webp","page":29,"width":1070,"height":328,"text":"第125题\n下面代码的输出结果是（）。\na,b,c,d,e,f = 'Python'\nb\n(A) 'y'\n(B) 1\n(C) 出错\n(D) 0"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"126","topic":"拆分、连接、替换和大小写","question":[{"src":"exam-images/choice-126-question-1.webp","page":29,"width":1070,"height":250,"text":"第126题\n设 str1 = '@python@'，语句 print (str1 [1:].strip ('@')) 的执行结果是:\n(A) python@*\n(B)@python@\n(C)* python*\n(D)python*"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"127","topic":"拆分、连接、替换和大小写","question":[{"src":"exam-images/choice-127-question-1.webp","page":29,"width":1070,"height":406,"text":"第127题\n下面代码的输出结果是（）。\na = \"alex\"\nb = a.capitalize ()\nprint (a, end=\",\")\nprint (b)\n(A) alex,Alex\n(B) alex,ALEX\n(C) ALEX,alex\n(D) Alex,Alex"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"128","topic":"字符串、索引与切片","question":[{"src":"exam-images/choice-128-question-1.webp","page":30,"width":1070,"height":250,"text":"第128题\n关于 Python 字符串，以下选项中描述错误的是\n(A) 字符串可以保存在变量中，也可以单独存在\n(B) 输出带有引号的字符串，可以使用转义字符\n(C) 可以使用 datatype () 测试字符串的类型\n(D) 字符串是一个字符序列，字符串中的编号叫 “索引”"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"129","topic":"输出格式和占位符","q estion":[{"src":"exam-images/choice-135-question-1.webp","page":31,"width":1070,"height":718,"text":"第135题\n关于 Python 字符串操作的描述，错误的是\n(A)>>> 'hellohellohello'[:3]\n输出结果是 'hello'\n(B)>>> 'hello'*2\n输出结果是 'hellohello'\n(C)>>> 'hello'-'world'\n输出结果是\nTraceback (most recent call last):\nFile \"\u003cpyshell#3>\", line 1, in \u003cmodule>\n'hello'-'world'\nTypeError: unsupported operand type (s) for -: 'str' and'str'\n(D)>>> 'hello' + 1\n输出结果是\nTraceback (most recent call last):\nFile \"\u003cpyshell#4>\", line 1, in \u003cmodule>\n'hello'+ 1\nTypeError: must be str, not int"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"136","topic":"双层循环、行和列","question":[{"src":"exam-images/choice-136-question-1.webp","page":32,"width":1070,"height":484,"text":"第136题\n给出下面代码：\npython\nfor i in range(1,10):\nfor j in range(1,i+1):\nprint(\"{}*{}={}\\t\".format(j,i,i*j),end = '')\nprint(\"\")\n以下选项中描述错误的是：（）。\n(A) 也可使用 While 嵌套循环实现打印九九乘法表\n(B) 内层循环用于控制一共打印 9 行\n(C) for i in range (1,10): 会执行 9 次循环内语句\n(D) 执行代码，输出九九乘法表"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"137","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-137-question-1.webp","page":32,"width":1070,"height":757,"text":"第137题\n以下程序的输出结果是:\npython\ndef fun1(a,b,*args):\nprint(a)\nprint(b)\nprint(args)\nfun1(1,2,3,4,5,6)\n(A) 1\n2\n(3, 4, 5, 6)\n(B) 1,2,3,4,5,6\n(C) 1\n2\n3, 4, 5, 6\n(D) 1\n2\n[3, 4, 5, 6]"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"138","topic":"return、print 与调用顺序","question":[{"src":"exam-images/choice-138-question-1.webp","page":32,"width":1070,"height":406,"text":"第138题\n下面代码的执行结果是\npython\ndef exchange(a,b):\na,b = b,a\nreturn (a,b)\nx = 10\ny = 20\nx,y = exchange(x,y)\nprint(exchange(x,y))"},{"src":"exam-images/choice-138-question-2.webp","page":33,"width":1070,"height":172,"text":"(A) (10, 20)\n(B) 10, 20\n(C) 20, 10\n(D) (20, 10)"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"139","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-139-question-1.webp","page":33,"width":1070,"height":445,"text":"第139题\n关于下列代码的描述，错误的选项是\npython\ndef f(x, y = 0, z = 0): pass\nf(1)\nf(1,,3)\n(A) f (1, z = 3) 属于合法调用，y 使用缺省参数值\n(B) pass 表示空语句，定义空函数体\n(C) f (1,,3) 是合法调用，y 使用缺省参数值，z 不使用缺省参数值\n(D) f (1) 是合法调用，y 与 z 使用缺省参数值"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"140","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-140-question-1.webp","page":33,"width":1070,"height":250,"text":"第140题\n以下关于函数参数的描述，错误的是:\n(A) 任意数量的位置参数定义的时候，需要一个星号前缀\n(B) 函数参数列表中可以定义默认参数，参数的位置不做要求\n(C) 用列表类型的变量 l 做参数，函数内改变参数的值，函数外的 l 的值会改变\n(D) 用数值类型的变量 t 做参数，函数内改变参数的值，函数外的 t 的值不变"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"141","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-141-question-1.webp","page":33,"width":1070,"height":289,"text":"第141题\n以下关于函数参数的描述，错误的是:\n(A) 函数里包含按参数名称传递的参数，定义顺序和调用顺序可以不同\n(B) 如果定义函数的时候没有指定参数的默认值，调用函数的时候，可以按照参数顺序给函\n数传参\n(C) 函数有可选参数的时候，定义时要放到非可选参数列表的后面\n(D) 给函数的参数指定默认值的时候，可以不给出参数名称"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"142","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-142-question-1.webp","page":33,"width":1070,"height":289,"text":"第142题\n关于形参和实参的描述，以下选项中正确的是（ ）\n(A) 参数列表中给出要传入函数内部的参数，这类参数称为形式参数，简称形参\n(B) 函数定义中参数列表里面的参数是实际参数，简称实参\n(C) 程序在调用时，将形参复制给函数的实参\n(D) 函数调用时，实参默认采用按照位置顺序的方式传递给函数，Python 也提供了按照形\n参名称输入实参的方式"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"143","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-143-question-1.webp","page":33,"width":1070,"height":172,"text":"第143题\n假设函数中不包括 global 保留字，对于改变实参值的方法，以下选项中错误的是\n(A) 参数是组合类型（可变对象）时，改变实参的值\n(B) 参数的值是否改变与函数中对变量的操作有关，与参数类型无关"},{"src":"exam-images/choice-143-question-2.webp","page":34,"width":1070,"height":94,"text":"(C) 参数是列表类型时，改变实参的值\n(D) 参数是整数类型时，不改变实参的值"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"144","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-144-question-1.webp","page":34,"width":1070,"height":289,"text":"第144题\n以下关于函数参数传递的描述，错误的是:\n(A) 在函数被调用时，函数可选参数的值可以用定义时的默认值\n(B) 当函数里执行到 return 语句的时候，就不会继续执行后续语句，而是返回到函数被调\n用的位置继续执行\n(C) 函数按照名称方式传递参数时，调用时的参数可以不按定义的顺序排列\n(D) 如果函数里面没有 return 语句，那么函数里数据处理的结果就没法让其他函数使用"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"145","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-145-question-1.webp","page":34,"width":1070,"height":679,"text":"第145题\n下面代码的执行，描述错误的是\npython\ndef fact(n,m=1):\ns = 1\nfor i in range(1,n+1):\ns *= i\nreturn s // m\nprint(fact(5,3))\nprint(fact(m = 3,n = 5))\n(A) 输出结果是\n40\n40\n(B) fact (m = 3,n = 5) 属于按名称传递传递参数的函数调用\n(C) def fact (n,m=1) 中的 m 属于可变参数，可以接收多个参数\n(D) fact (5,3) 属于按位置传递参数的函数调用"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"146","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-146-question-1.webp","page":34,"width":1070,"height":406,"text":"第146题\n以下程序的输出结果是:\npython\ndef fun(x = 2,y = 3):\nprint(x,y)\nfun(y=5,x=4)\n(A) 4 5\n(B) 2 3\n(C) 5 4\n(D) 3 2"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"147","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-147-question-1.webp","page":34,"width":1070,"height":172,"text":"第147题\n关于形参和实参的描述，以下选项中正确的是\n(A) 程序在调用时，将实参复制给函数的形参\n(B) 程序在调用时，将形参复制给函数的实参"},{"src":"exam-images/choice-147-question-2.webp","page":35,"width":1070,"height":94,"text":"(C) 函数定义中参数列表里面的参数是实际参数，简称实参\n(D) 参数列表中给出要传入函数内部的参数，这类参数称为形式参数，简称形参"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"148","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-148-question-1.webp","page":35,"width":1070,"height":250,"text":"第148题\n下列选项执行时，出现错误的是\n(A) f (1)\n(B) f (,2)\n(C) f (1,)\n(D) f (1,2)"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"149","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-149-question-1.webp","page":35,"width":1070,"height":289,"text":"第149题\n关于函数的参数，以下选项中描述错误的是\n(A) 一个元组可以传递给带有星号的可变参数\n(B) 在定义函数时，如果有些参数存在默认值，可以在定义函数时直接为这些参数指定默认\n值\n(C) 可选参数可以定义在非可选参数的前面\n(D) 在定义函数时，可以设计可变数量参数，通过在参数前增加星号（*）实现"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"150","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-150-question-1.webp","page":35,"width":1070,"height":289,"text":"第150题\n以下关于 Python 函数对变量的作用，错误的是:\n(A) 简单数据类型变量仅在函数内部创建和使用，函数退出后变量被释放\n(B) 对于组合数据类型的全局变量，如果在函数内部没有被真实创建的同名变量，则函数内\n部不可以直接使用并修改全局变量的值\n(C) 全局变量指在函数之外定义的变量，在程序执行全过程有效\n(D) 简单数据类型在函数内部用 global 保留字声明后，函数退出后该变量保留"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"151","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-151-question-1.webp","page":35,"width":1070,"height":289,"text":"第151题\n关于局部变量和全局变量，以下选项中描述错误的是（ ）\n(A) 局部变量和全局变量是不同的变量，但可以使用 global 保留字在函数内部使用全局变\n量\n(B) 局部变量为组合数据类型且未创建，等同于全局变量\n(C) 函数运算结束后，局部变量不会被释放\n(D) 局部变量是函数内部的占位符，与全局变量可能重名但不同"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"152","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-152-question-1.webp","page":35,"width":1070,"height":250,"text":"第152题\n假设函数中不包括 global 保留字，对于改变参数值的方法，以下选项中错误的是（ ）\n(A) 参数是 int 类型时，不改变原参数的值\n(B) 参数是 list 类型时，改变原参数的值\n(C) 参数的值是否改变与函数中对变量的操作有关，与参数类型无关\n(D) 参数是组合类型（可变对象）时，改变原参数的值"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"153","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-153-question-1.webp","page":35,"width":1070,"height":133,"text":"第153题\n关于 Python 的全局变量和局部变量，以下选项中描述错误的是\n(A) 局部变量指在函数内部使用的变量，当函数退出时，变量依然存在，下次函数调用可以"},{"src":"exam-images/choice-153-question-2.webp","page":36,"width":1070,"height":211,"text":"继续使用\n(B) 使用 global 保留字声明简单数据类型变量后，该变量作为全局变量使用\n(C) 全局变量指在函数之外定义的变量，一般没有缩进，在程序执行全过程有效\n(D) 简单数据类型变量无论是否与全局变量重名，仅在函数内部创建和使用，函数退出后变\n量被释放"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"154","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-154-question-1.webp","page":36,"width":1070,"height":250,"text":"第154题\n在 Python 中，关于全局变量和局部变量，以下选项中描述不正确的是（）。\n(A) 全局变量不能和局部变量重名\n(B) 一个程序中的变量包含两类：全局变量和局部变量\n(C) 全局变量一般没有缩进\n(D) 全局变量在程序执行的全过程有效"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"155","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-155-question-1.webp","page":36,"width":1070,"height":250,"text":"第155题\n在 Python 中，关于全局变量和局部变量，以下选项中描述不正确的是\n(A) 全局变量一般没有缩进\n(B) 全局变量不能和局部变量重名\n(C) 一个程序中的变量包含两类：全局变量和局部变量\n(D) 全局变量在程序执行的全过程有效"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"156","topic":"局部名字、全局名字和共享列表","question":[{"src":"exam-images/choice-156-question-1.webp","page":36,"width":1070,"height":250,"text":"第156题\n关于函数局部变量和全局变量的使用规则，以下选项中描述错误的是（）。\n(A) return 不可以传递任意多个函数局部变量返回值\n(B) 对于基本数据类型的变量，无论是否重名，局部变量与全局变量不同\n(C) 可以通过 global 保留字在函数内部声明全局变量\n(D) 对于组合数据类型的变量，如果局部变量未真实创建，则是全局变量"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"157","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-157-question-1.webp","page":36,"width":1070,"height":250,"text":"第157题\n以下关于函数参数传递的描述，错误的是：\n(A) 调用函数时，可变数量参数被当做元组类型传递到函数中\n(B) 定义函数的时候，可选参数必须写在非可选参数的后面\n(C) 函数的实参位置可变，需要形参定义和实参调用时都要给出名称\n(D) Python 支持可变数量的参数，实参用” * 参数名” 表示"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"158","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-158-question-1.webp","page":36,"width":1070,"height":367,"text":"第158题\n设函数f定义如下\npython\ndef f(x,y = 0):pass\n下列选项执行时，出现错误的是\n(A)f(,2)\n(B)f(1)\n(C)f(1,)\n(D)f(1,2)"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"159","topic":"定义、位置参数与关键字参数","question":[{"src":"exam-images/choice-159-question-1.webp","page":37,"width":1070,"height":640,"text":"第159题\n下面代码的执行，描述错误的是\npython\ndef fact(n,m=1):\ns = 1\nfor i in range(1,n+1):\ns *= i\nreturn s // m\nprint(fact(5,3))\nprint(fact(m = 3,n = 5))\n(A) fact (m = 3,n = 5) 属于按名称传递传递参数的函数调用\n(B) 输出结果是\n40\n40\n(C) def fact (n,m=1) 中的 m 属于可变参数，可以接收多个参数\n(D) fact (5,3) 属于按位置传递参数的函数调用"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"附1","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-1-question-1.webp","page":37,"width":1070,"height":211,"text":"单选-第1题-4.0分(共10题，共40.0分)关于递归函数的描述，以下选项中正确的是\n(A)包含一个循环结构\n(B)函数比较复杂\n(C)函数名称作为返回值\n(D)函数内部包含对本函数的再次调用"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"附2","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-2-question-1.webp","page":37,"width":1070,"height":445,"text":"单选-第2题-4.0分(共10题，共40.0分)\n下面代码实现的功能描述的是\ndef fact(n):\nif n=-0:\nretunn 1\nelse:\nreturn n fact(n-1)num =eval(input(\"请输入一个整数:\"))print(fact(abs(int(num))))\n(A)接受用户输入的整数n，判断n是否是素数并输出结论\n(B)接受用户输入的整数n，输出n的阶乘值\n(C)接受用户输入的整数n，判断是否是完数并输出结论\n(D)接受用户输入的整数n，判断n是否是水仙花数"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"附3","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-3-question-1.webp","page":37,"width":1070,"height":250,"text":"单选-第3题-4.0分(共10题，共40.0分)\n关于递归函数的描述，以下选项中正确的是()。\n(A)函数名称作为返回值\n(B)包含一个循环结构\n(C)函数内部包含对本函数的再次调用\n(D)函数比较复杂"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"附4","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-4-question-1.webp","page":37,"width":1070,"height":55,"text":"单选-第4题-4.0分(共10题，共40.0分)"},{"src":"exam-images/choice-extra-4-question-2.webp","page":38,"width":1070,"height":211,"text":"关于递归函数基例的说明，以下选项中错误的是()。\n(A)递归函数的基例决定递归的深度\n(B)递归函数必须有基例\n(C)每个递归函数都只能有一个基例\n(D)递归函数的基例不再进行递归"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"附5","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-5-question-1.webp","page":38,"width":1070,"height":250,"text":"单选-第5题-4.0分(共10题，共40.0分)\n以下选项中，对于递归程序的描述错误的是()。\n(A)递归程序都可以有非递归编写方法\n(B)书写简单\n(C)一定要有基例\n(D)执行效率高"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"附6","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-6-question-1.webp","page":38,"width":1070,"height":211,"text":"单选-第6题-4.0分(共10题，共40.0分)以下选项中，对于递归程序的描述错误的是\n(A)递归程序都可以有非递归编写方法\n(B)执行效率高\n(C)书写简单\n(D)一定要有基例"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"附7","topic":"递归、自调用与停止条件","question":[{"src":"exam-images/choice-extra-7-question-1.webp","page":38,"width":1070,"height":250,"text":"单选-第7题-4.0分(共10题，共 , end = \"\")\n(A)Hello\n(B)World\n(C)HelloWorld\n(D)Helloorld"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"218","topic":"跳过、退出和循环 else","question":[{"src":"exam-images/choice-218-question-1.webp","page":55,"width":1070,"height":250,"text":"第218题\n关于 break 语句与 continue 语句的说法中，以下选项中不正确的是\n(A) break 语句结束循环，继续执行循环语句的后续语句\n(B) continue 语句结束循环，继续执行循环语句的后续语句\n(C) continue 语句类似于 break 语句，也必须在 for、while 循环中使用\n(D) 当多个循环语句嵌套时，break 语句只适用于最里层的语句"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"219","topic":"跳过、退出和循环 else","question":[{"src":"exam-images/choice-219-question-1.webp","page":55,"width":1070,"height":250,"text":"第219题\n关于 break 的作用，描述正确的是\n(A) 跳出所有的 for/while 循环\n(B) 按照缩进跳出当前层语句块\n(C) 跳出当前层 for/while 循环\n(D) 按照缩进跳出除函数缩进外的所有语句块"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"220","topic":"逗号分隔的文件与行列","question":[{"src":"exam-images/choice-220-question-1.webp","page":55,"width":1070,"height":250,"text":"第220题\n以下选项中，对CSV格式的描述正确的是（）。\n(A)CSV文件以英文逗号分隔元素\n(B)CSV文件以英文特殊符号分隔元素\n(C)CSV文件以英文空格分隔元素\n(D)CSV文件以英文分号分隔元素"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"221","topic":"二维列表和数据维度","question":[{"src":"exam-images/choice-221-question-1.webp","page":55,"width":1070,"height":250,"text":"第221题\n关于数据组织的维度，以下选项中描述错误的是（）。\n(A)数据组织存在维度，字典类型用于表示一维和二维数据\n(B)一维数据采用线性方式组织，对应于数学中的数组和集合等概念\n(C)高维数据由键值对类型的数据构成，采用对象方式组织\n(D)二维数据采用表格方式组织，对应于数学中的矩阵"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"222","topic":"文件模式、路径与编码","question":[{"src":"exam-images/choice-222-question-1.webp","page":55,"width":1070,"height":172,"text":"第222题\n关于文件的打开方式，以下选项中描述正确的是（）。\n(A)文件只能选择二进制或文本方式打开\n(B)所有文件都可能以二进制方式打开"},{"src":"exam-images/choice-222-question-2.webp","page":56,"width":1070,"height":94,"text":"(C)文本文件只能以文本方式打开\n(D)所有文件都可能以文本方式打开"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"223","topic":"文件模式、路径与编码","question":[{"src":"exam-images/choice-223-question-1.webp","page":56,"width":1070,"height":250,"text":"第223题\n以下选项中，不是Python文件打开的合法 )\nfo.seek(0)\nfor line in fo:\nprint(line)\nfo.close()\n以下选项中描述错误的是（）。\n(A)执行代码时，从键盘输入“清明.txt”，则清明.txt被创建\n(B)代码主要功能为向文件写入一个列表类型，并打印输出结果\n(C)fo.writelines(ls)将元素全为字符串的ls列表写入文件\n(D)fo.seek(0)这行代码如果省略，也能打印输出文件内容"}],"answer":[],"marked":["D"]},{"kind":"choice","number":"230","topic":"二维列表和数据维度","question":[{"src":"exam-images/choice-230-question-1.webp","page":57,"width":1070,"height":250,"text":"第230题\n关于数据组织的维度，以下选项中描述错误的是（）。\n(A)数据组织存在维度，字典类型用于表示一维和二维数据\n(B)高维数据由键值对类型的数据构成，采用对象方式组织\n(C)一维数据采用线性方式组织，对应于数学中的数组和集合等概念\n(D)二维数据采用表格方式组织，对应于数学中的矩阵"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"231","topic":"二维列表和数据维度","question":[{"src":"exam-images/choice-231-question-1.webp","page":57,"width":1070,"height":250,"text":"第231题\n给定列表ls = [1, 2, 3, \"1\", \"2\", \"3\"]，其元素包含两种数据类型，则ls的数据组织维度是（）。\n(A)一维数据\n(B)高维数据\n(C)二维数据\n(D)多维数据"}],"answer":[],"marked":["A"]},{"kind":"choice","number":"232","topic":"二维列表和数据维度","question":[{"src":"exam-images/choice-232-question-1.webp","page":57,"width":1070,"height":289,"text":"第232题\n给定字典d = {1:\"1\", 2:\"2\", 3: \"3\"}，其元素包含两种数据类型，则字典d的数据组织维度是\n（）。\n(A)一维数据\n(B)高维数据\n(C)二维数据\n(D)多维数据"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"233","topic":"二维列表和数据维度","question":[{"src":"exam-images/choice-233-question-1.webp","page":58,"width":1070,"height":250,"text":"第233题\n“键值对”类型数据的组织维度是（）。\n(A)一维数据\n(B)高维数据\n(C)二维数据\n(D)多维数据"}],"answer":[],"marked":["B"]},{"kind":"choice","number":"234","topic":"文件模式、路径与编码","question":[{"src":"exam-images/choice-234-question-1.webp","page":58,"width":1070,"height":250,"text":"第234题\n以下选项中，不是Python文件打开的合法模式组合是（）。\n(A)\"r\"\n(B)\"+\"\n(C)\"w\"\n(D)\"a\""}],"answer":[],"marked":["B"]},{"kind":"choice","number":"235","topic":"文件模式、路径与编码","question":[{"src":"exam-images/choice-235-question-1.webp","page":58,"width":1070,"height":250,"text":"第235题\n当打开一个不存在的文件时，以下选项中描述正确的是（）。\n(A)一定会报错\n(B)文件不存在则创建文件\n(C)根据打开类型不同，可能不报错\n(D)不存在文件无法被打开"}],"answer":[],"marked":["C"]},{"kind":"choice","number":"236" 的结果左边，再继续用整数商计算。","用 13 转二进制应得 1101；输入 0 时直接返回 \"0\"。"],"question":[{"src":"exam-images/program-938-question-1.webp","page":5,"width":1039,"height":192}],"answer":[{"src":"exam-images/program-938-answer-1.webp","page":5,"width":1039,"height":295}]},{"kind":"program","number":"939","topic":"递归进制转换","notes":["整数除法得到高位部分，取余得到最后一位，所以适合先递归高位。","若当前值小于目标进制，直接取字符；否则把递归转换的商接上当前余数字符。","以 13 到二进制为例，商逐步 13→6→3→1，逐层返回组成 1101。"],"question":[{"src":"exam-images/program-939-question-1.webp","page":6,"width":1039,"height":227}],"answer":[{"src":"exam-images/program-939-answer-1.webp","page":6,"width":1039,"height":256}]},{"kind":"program","number":"940","topic":"循环求最大公约数","notes":["两个正整数的最大公约数，等于较小数与相除余数的最大公约数。","每轮同时做 a,b=b,a%b；b 变 0 时 a 就是答案。先判断再取余可避免除以零。","用 (20,12) 推到 (12,8)、(8,4)、(4,0)。返回 4。"],"question":[{"src":"exam-images/program-940-question-1.webp","page":6,"width":1039,"height":261}],"answer":[{"src":"exam-images/program-940-answer-1.webp","page":6,"width":1039,"height":220}]},{"kind":"program","number":"941","topic":"递归求最大公约数","notes":["欧几里得算法每步保持最大公约数不变，余数越来越小。","先判断 b==0 并返回 a；否则 return gcd(b,a%b)。注意把下一层的结果传回来。","用能整除和不能一步整除的输入各测一次。只递归却漏写 return 会使调用处拿到 None。"],"question":[{"src":"exam-images/program-941-question-1.webp","page":7,"width":1039,"height":245}],"answer":[{"src":"exam-images/program-941-answer-1.webp","page":7,"width":1039,"height":241}]},{"kind":"program","number":"942","topic":"汉诺塔递归","notes":["移动最大的盘之前，必须先挪走压在它上面的所有小盘。","拆为三步：小盘移到辅助柱，移动大盘到目标柱，小盘再从辅助柱移到目标柱。每次交换起点、辅助和终点的角色。","n=1 时只需一次移动，n=2 时应恰好三次。若输出需要盘号，移动大盘时打印当前 n。"],"question":[{"src":"exam-images/program-942-question-1.webp","page":7,"width":1039,"height":317}],"answer":[{"src":"exam-images/program-942-answer-1.webp","page":7,"width":1039,"height":195}]},{"kind":"program","number":"926","topic":"函数内打印一段整数","notes":["函数内的循环在一次调用中依次处理两个端点之间的整数。","把左右端点作为参数传入。若题意包含右端点，循环停止边界写右端点+1，再用 end 控制间隔。","左右端点相等时应恰好打印一个数，核对题目对行末空格的要求。"],"question":[{"src":"exam-images/program-926-question-1.webp","page":8,"width":1039,"height":244}],"answer":[{"src":"exam-images/program-926-answer-1.webp","page":8,"width":1039,"height":240}]},{"kind":"program","number":"927","topic":"重复字符画居中三角","notes":["居中形状每行前导空格递减，符号数按奇数递增。","第 i 行（从 1 数）打印 n-i 个空格和 2*i-1 个星号。函数接到新的 n 时重新从第一行开始。","n=3 时符号数是 1、3、5，左侧空格数是 2、1、0。"],"question":[{"src":"exam-images/program-927-question-1.webp","page":8,"width":1039,"height":300}],"answer":[{"src":"exam-images/program-927-answer-1.webp","page":8,"width":1039,"height":183}]},{"kind":"program","number":"928","topic":"函数返回区间和","notes":["求和的累计值必须放到循环外初始化，才能跨轮保留。","函数收两个端点，遍历包含两端的范围；逐项相加，循环结束 return，调用处再 print。","输入端点相同应返回那个数。把 return 缩进到循环里会只算第一轮。"],"question":[{"src":"exam-images/program-928-question-1.webp","page":9,"width":1039,"height":244}],"answer":[{"src":"exam-images/program-928-answer-1.webp","page":9,"width":1039,"height":237}]},{"kind":"program","number":"929","topic":"函数判断闰年并批量筛选","notes":["公历闰年是 400 的倍数，或是 4 的倍数但不是 100 的倍数。","把规则写成返回布尔值的函数，在外层循环中只打印结果为真的年份。","用 1900、2000、2028 区分世纪年和普通年。只用 %4 的原参考写法遇到 1900 会错。"],"question":[{"src":"exam-images/program-929-question-1.webp","page":9,"width":1039,"height":300}],"answer":[{"src":"exam-images/program-929-answer-1.webp","page":9,"width":1039,"height":183}]},{"kind":"program","number":"930","topic":"枚举偶数的素数拆分","notes":["固定一个加数后，另一个加数等于目标减去它。","先实现 is_prime，排除小于 2 和有真因子的数。再枚举一个加数，对左右两个数都调用判断。","题目样例若同时列出 3+5 和 5+3，就枚举全范围；若一对只列一次，左侧只枚举到目标的一半。"],"question":[{"src":"exam-images/program-930-question-1.webp","page":10,"width":1039,"height":478},{"src":"exam-images/program-930-question-2.webp","page":10,"width":1039,"height":134}],"answer":[{"src":"exam-images/program-930-answer-1.webp","page":10,"width":1039,"height":361}]},{"kind":"program","number":"911","topic":"按阈值累计衰减项","notes":["每轮的加项越来越小，停止条件应针对当前项的大小。","从首项开始。只要当前项满足阈值就加到总和，再将分母乘 2 得到下一项。最终统一格式化。","用容易手算的大阈值试一下，确认小于阈值的那一项没有被加进去。"],"question":[{"src":"exam-images/program-911-question-1.webp","page":11,"width":1039,"height":264}],"answer":[{"src":"exam-images/program-911-answer-1.webp","page":11,"width":1039,"height":219}]},{"kind":"program","number":"913","topic":"判断单个整数是否为素数","notes":["素数要大于 1，且没有介于 2 和自身之间的因子。","先排除 0、1 和负数；遍历可能因子，找到一个取余为 0 就判合数。全部检查完才判素数。","测试 1、2、4、13。只用空循环的原答案会误把 1 当素数。"],"question":[{"src":"exam-images/program-913-question-1.webp","page":11,"width":1039,"height":225}],"answer":[{"src":"exam-images/program-913-answer-1.webp","page":11,"width":1039,"height":254}]},{"kind":"program","number":"914","topic":"按行列编号输出矩阵","notes":["矩阵是逐行逐列生成。","用外层数行、内层数列，把当前行列换成对应数字。内层打印时让数据留在同一行，内层结束再换行。","数第二行第一格，确认没有把行编号或列编号起点加错。"],"question":[{"src":"exam-images/program-914-question-1.webp","page":12,"width":1039,"height":189}],"answer":[{"src":"exam-images/program-914-answer-1.webp","page":12,"width":1039,"height":291}]},{"kind":"program","number":"915","topic":"三角形乘法表","notes":["上三角或下三角的关键是每一行列数的变化。","先照样例写出每行该有几项。行号和列号都确定后，再格式化成“乘数×乘数=乘积”。","手算前两行，对照乘数顺序、制表符或空格以及换行。"],"question":[{"src":"exam-images/program-915-question-1.webp","page":12,"width":1039,"height":316}],"answer":[{"src":"exam-images/program-915-answer-1.webp","page":12,"width":1039,"height":161}]},{"kind":"program","number":"916","topic":"输出区间内所有素数","notes":["列出区间里的全部素数，需要对每个数独立判断。","外层枚举候选值，内层寻找因子。发现合数仅结束这一候选的内层，找不到因子才打印候选。","根据题意是否含左右端点设定范围；n=2 时即使内层为空也应是素数。"],"question":[{"src":"exam-images/program-916-question-1.webp","page":13,"width":1039,"height":279}],"answer":[{"src":"exam-images/program-916-answer-1.webp","page":13,"width":1039,"height":200}]},{"kind":"program","number":"501","topic":"两项字符串同时匹配","notes":["两个字符串必须同时相等，要用 and。","分别读两行、按题意处理首尾空白。将两次比较放进 if；两个条件都真才走成功分支。","拿“第一项对、第二项错”和“全部正确”各试一次。保留题目指定的输出大小写。"],"question":[{"src":"exam-images/program-501-question-1.webp","page":13,"width":1039,"height":447}],"answer":[{"src":"exam-images/program-501-answer-1.webp","page":14,"width":1039,"height":375}]},{"kind":"program","number":"899","topic":"闰年分支","notes":["闰年测试同时包含普通年规则与世纪年例外。","可按可整除 400→可整除 100→可整除 4 的顺序判断，也可写成合并的逻辑式。","2000 是闰年，1900 不是，2028 是；用这三例快速抓住边界。"],"question":[{"src":"exam-images/program-899-question-1.webp","page":14,"width":1039,"height":280}],"answer":[{"src":"exam-images/program-899-answer-1.webp","page":14,"width":1039,"height":200}]},{"kind":"program","number":"900","topic":"检查三边后应用公式","notes":["边长合法才可以套海伦公式。","先确认长度为正，三边排序后看短边之和是否大于最长边。成立后求半周长 p，再算 sqrt(p*(p-a)*(p-b)*(p-c))。","3、4、5 的面积为 6；1、2、3 因短边和恰好等于最长边而无效。"],"question":[{"src":"exam-images/program-900-question-1.webp","page":14,"width":1039,"height":485},{"src":"exam-images/program-900-question-2.webp","page":15,"width":1039,"height":78}],"answer":[{"src":"exam-images/program-900-answer-1.webp","page":15,"width":1039,"height":354}]},{"kind":"program","number":"901","topic":"按区间输出等级并处理无效输入","notes":["分类先排除无效值，区间边界要一项也不漏。","输入先转数，转换失败单独处理。负数走无效分支；从小到大比较分界值，按首个满足的区间输出。","专测 0、35、75 和负数，判断等号应放在哪一边。"],"question":[{"src":"exam-images/program-901-question-1.webp","page":15,"width":1039,"height":337}],"answer":[{"src":"exam-images/program-901-answer-1.webp","page":15,"width":1039,"height":374}]},{"kind":"program","number":"902","topic":"拆分输入、按公式算值并分级","notes":["分段判断应使用计算得到的原始数值，显示时才保留小数。","先用逗号拆出两项，按原顺序转成 float。先算平方，再做除法。用 elif 划分区间。","给边界值或与边界极接近的值，防止把格式化后的数拿去分类。"],"question":[{"src":"exam-images/program-902-question-1.webp","page":16,"width":1039,"height":360}],"answer":[{"src":"exam-images/program-902-answer-1.webp","page":16,"width":1039,"height":412}]},{"kind":"program","number":"931","topic":"循环函数求阶乘","notes":["阶乘循环是从 1 开始的累乘。","初始化结果为 1，每次乘一个整数直到 n。函数返回结果，调用处负责输出。","n=0 时不进循环，初值 1 就是答案；n=4 时应得 24。"],"question":[{"src":"exam-images/program-931-question-1.webp","page":16,"width":1039,"height":224}],"answer":[{"src":"exam-images/program-931-answer-1.webp","page":16,"width":1039,"height":253}]},{"kind":"program","number":"933","topic":"无参数、函数内打印","notes":["没有参数仍要写空括号，print 可以放在函数里。","先定义函数体，让它打印指定文本。在定义块之外调用一次，检查没有额外打印调用返回的 None。","试着把调用行删掉，看见仅定义函数不会输出。"],"question":[{"src":"exam-images/program-933-question-1.webp","page":17,"width":1039,"height":260}],"answer":[{"src":"exam-images/program-933-answer-1.webp","page":17,"width":1039,"height":202}]},{"kind":"program","number":"934","topic":"无参数、返回字符串","notes":["return 传回值，print 才显示在屏幕。","函数没有参数，直接返回固定文本。外面用 print(f()) 输出这个返回结果。","如果函数中 print 且外面再 print(f())，会多显示 None。"],"question":[{"src":"exam-images/program-934-question-1.webp","page":17,"width":1039,"height":226}],"answer":[{"src":"exam-images/program-934-answer-1.webp","page":17,"width":1039,"height":247}]},{"kind":"program","number":"935","topic":"一个参数对应一个称呼","notes":["把变化的部分作为参数传入，固定文字留在模板中。","读取姓名，把值传给函数；函数格式化后 return；调用处打印。","换一个姓名，观察只有模板中的姓名位置变化。"],"question":[{"src":"exam-images/program-935-question-1.webp","page":17,"width":1039,"height":214}],"answer":[{"src":"exam-images/program-935-answer-1.webp","page":17,"width":1039,"height":250}]},{"kind":"program","number":"936","topic":"两个参数和分支返回","notes":["函数可以先根据参数决定用哪段文字，再统一组合返回。","接收两个参数；在 if/elif/else 里选称呼，再将称呼和名字插入模板。","正确的已知值和未知值分别试一次，确认每条路线都对称呼赋值。"],"question":[{"src":"exam-images/program-936-question-1.webp","page":18,"width":1039,"height":228}],"answer":[{"src":"exam-images/program-936-answer-1.webp","page":18,"width":1039,"height":266}]},{"kind":"program","number":"937","topic":"默认参数与可变数量输入","notes":["默认参数只在该实参缺失时使用。","先按空白拆分输入。如果只有姓名，直接传一个参数；如果有两项，从列表解包传入，第二项覆盖默认值。","单独测试一个词、两个词。不要把少传误写成一个空的逗号位置。"],"question":[{"src":"exam-images/program-937-question-1.webp","page":18,"width":1039,"height":225}],"answer":[{"src":"exam-images/program-937-answer-1.webp","page":18,"width":1039,"height":252}]},{"kind":"program","number":"904","topic":"累计 1 到 n","notes":["连续整数求和可以靠从 0 开始的累计值。","遍历 1 到 n，停止参数写 n+1。每轮更新总和，退出循环后只打印最终结果。","用 n=1、3，结果应分别是 1、6；注意题目不要求输入提示。"],"question":[{"src":"exam-images/program-904-question-1.webp","page":19,"width":1039,"height":283}],"answer":[{"src":"exam-images/program-904-answer-1.webp","page":19,"width":1039,"height":198}]},{"kind":"program","number":"905","topic":"逗号输入与闭区间求和","notes":["两个端点先各自转整数，再决定是否包含右端点。","逗号拆分得到左右端点；按闭区间累加，最后拼好要求的输出前缀。","用 2,5 手算 2+3+4+5=14，查有没有少算 5。"],"question":[{"src":"exam-images/program-905-question-1.webp","page":19,"width":1039,"height":212}],"answer":[{"src":"exam-images/program-905-answer-1.webp","page":19,"width":1039,"height":269}]},{"kind":"program","number":"908","topic":"闭区间内的奇数累加","notes":["奇偶可通过取余判断，也可从第一个奇数起每次加 2。","写清起点与终点，再用 range(起点,右端点+1,2) 或逐个 if。","测包含两端的范围，从 3 到 7 结果是 15。"],"question":[{"src":"exam-images/program-908-question-1.webp","page":20,"width":1039,"height":206}],"answer":[{"src":"exam-images/program-908-answer-1.webp","page":20,"width":1039,"height":270}]},{"kind":"program","number":"909","topic":"while 累计到 n","notes":["while 需要自己的计数器和更新语句。","用 i=1、total=0 开始，i\u003c=n 时先把 i 加入，再令 i+=1；退出后输出 total。","如果更新漏写或缩进放错会一直循环。n=3 应只进入三次。"],"question":[{"src":"exam-images/program-909-question-1.webp","page":20,"width":1039,"height":192}],"answer":[{"src":"exam-images/program-909-answer-1.webp","page":20,"width":1039,"height":291}]},{"kind":"program","number":"910","topic":"while 累计任意闭区间","notes":["同一套 while 求和只需把起点改为题目给的左端点。","i 从左端开始，条件用 i\u003c=右端；每轮累计并向前移动一格。","如果左右端点相同仍应执行一次，便于抓出误用 \u003c 的问题。"],"question":[{"src":"exam-images/program-910-question-1.webp","page":21,"width":1039,"height":208}],"answer":[{"src":"exam-images/program-910-answer-1.webp","page":21,"width":1039,"height":275}]},{"kind":"program","number":"943","topic":"按位置插入并末尾追加","notes":["insert 放在给定下标前，append 放到末尾。","读字符串和下标，根据原题阈值判断是指定位置插入还是定位到列表末尾，再做题目要求的另外一次追加。","测第一个位置、阈值恰好相等、超出阈值三种输入，核对出现次数。"],"question":[{"src":"exam-images/program-943-question-1.webp","page":21,"width":1039,"height":282}],"answer":[{"src":"exam-images/program-943-answer-1.webp","page":21,"width":1039,"height":200}]},{"kind":"program","number":"944","topic":"把字符串变成列表再删除一段","notes":["删除连续一段时用 del 加切片，下标从 0 数。","把文本用 list 转成逐字符列表，再用 del values[m:n] 删一段。若题目要求包含右下标，就相应把停止值加一。","用几项短列表试删，肉眼对照保留的前缀和后缀。"],"question":[{"src":"exam-images/program-944-question-1.webp","page":22,"width":1039,"height":317}],"answer":[{"src":"exam-images/program-944-answer-1.webp","page":22,"width":1039,"height":164}]},{"kind":"program","number":"945","topic":"列表拼接、重复、索引和极值","notes":["拼接、重复、索引、切片是四个不同的操作。","分别把两行转换成列表。按输出顺序每项写一行：连接、重复、取指定项、截取片段、长度、极值。","极值若按字符串比较，'10' 与 '2' 不等同于数值大小；题目若全是单字符，按原类型算。"],"question":[{"src":"exam-images/program-945-question-1.webp","page":22,"width":1039,"height":417}],"answer":[{"src":"exam-images/program-945-answer-1.webp","page":22,"width":1039,"height":360}]},{"kind":"program","number":"946","topic":"两行整数合并并降序","notes":["sort 改当前列表，sorted 生成指定顺序的新列表。","两行各用 split 拆项，逐项 int 转换。用 + 拼接列表，再按降序排序并输出整份列表。","用 2、10 和重复数字测试排序，避免把数字按字符串顺序排。多余空格不应成为元素。"],"question":[{"src":"exam-images/program-946-question-1.webp","page":23,"width":1039,"height":334}],"answer":[{"src":"exam-images/program-946-answer-1.webp","page":23,"width":1039,"height":137}]},{"kind":"program","number":"947","topic":"去重再排序","notes":["集合去除重复项，排序才能保证输出顺序。","先构造集合，再 sorted 得到有序列表。逐个打印或 join 时按题意控制分隔。","重复值输入多次也只显示一次。不要依赖遍历集合的偶然顺序。"],"question":[{"src":"exam-images/program-947-question-1.webp","page":23,"width":1039,"height":208}],"answer":[{"src":"exam-images/program-947-answer-1.webp","page":23,"width":1039,"height":271}]},{"kind":"program","number":"948","topic":"统计每种值的次数并排序","notes":["先列出不同值的顺序，再分别查它出现几次。","可用 sorted(set(items)) 定顺序，用 count 找次数，也可先累计字典再按键排序。","对照总和，所有次数相加应等于原列表项数。"],"question":[{"src":"exam-images/program-948-question-1.webp","page":24,"width":1039,"height":282}],"answer":[{"src":"exam-images/program-948-answer-1.webp","page":24,"width":1039,"height":191}]},{"kind":"program","number":"949","topic":"读到结束标记，计算五种统计量","notes":["平均值和方差先需要数值，中位数先需要排序。","读下一行，判断是否为结束标记，非标记转数字再存。先算数量、和、均值，再将平方偏差相加除以数量；中位数按奇偶项数分别求。","用 1、3、7、9 检查中位数是 5；保留空输入处理。原示例直接按字符串排序会把 10 放到 2 前。"],"question":[{"src":"exam-images/program-949-question-1.webp","page":24,"width":1039,"height":484}],"answer":[{"src":"exam-images/program-949-answer-1.webp","page":24,"width":1039,"height":505}]},{"kind":"program","number":"891","topic":"读取指数并求乘方","notes":["指数次数来自输入，Python 的乘方运算符是 **。","用 int 读 n，再写 2**n 并输出。","n=0 得 1，n=5 得 32。^ 不是乘方。"],"question":[{"src":"exam-images/program-891-question-1.webp","page":25,"width":1039,"height":189}],"answer":[{"src":"exam-images/program-891-answer-1.webp","page":25,"width":1039,"height":245}]},{"kind":"program","number":"892","topic":"拆开根式公式并格式化","notes":["算根式要把一个长式拆成几个依赖顺序明确的中间量。","先算括号内的判别量，再开平方；按原题括号组合分子与分母；最后控制小数位。","多试一个可以手算的平方根，检查除法是不是只除了一部分分子。"],"question":[{"src":"exam-images/program-892-question-1.webp","page":25,"width":1039,"height":263}],"answer":[{"src":"exam-images/program-892-answer-1.webp","page":25,"width":1039,"height":218}]},{"kind":"program","number":"893","topic":"使用标准库求阶乘","notes":["math.factorial 已实现非负整数阶乘。","导入 math；把整数传给 math.factorial 并 print。","0 的阶乘是 1。负数不属于定义域，浮点值也不能直接传当作整数。"],"question":[{"src":"exam-images/program-893-question-1.webp","page":26,"width":1039,"height":169}],"answer":[{"src":"exam-images/program-893-answer-1.webp","page":26,"width":1039,"height":269}]},{"kind":"program","number":"894","topic":"拆取十进制数字","notes":["个位是对 10 取余，移去末尾一位用整除 10。","先 n%10 取个位，再 n//10%10 取十位，最后 n//100 取三位数的百位。","用 705 试，十位应保留 0，输出顺序和逗号按题面。"],"question":[{"src":"exam-images/program-894-question-1.webp","page":26,"width":1039,"height":210}],"answer":[{"src":"exam-images/program-894-answer-1.webp","page":26,"width":1039,"height":233}]},{"kind":"program","number":"895","topic":"乘方模拟增长和衰减","notes":["连续变化的倍率能相乘，多日用乘方；比较两种结果再除一次。","先把题目给的变化率换成每次倍率，写增长和衰减两个公式，再按题面的基准日计算变化次数。","变化率为 0 时两条结果应相等且比例为 1。样例常对小数位有分别要求。"],"question":[{"src":"exam-images/program-895-question-1.webp","page":26,"width":1039,"height":318}],"answer":[{"src":"exam-images/program-895-answer-1.webp","page":26,"width":1039,"height":162}]},{"kind":"program","number":"918","topic":"蒙特卡罗估算圆周率","notes":["均匀撒点时，命中比例近似面积比例。","固定题目种子，在单位正方形反复取 x、y，检查 x*x+y*y\u003c=1；计数除以总次数后乘 4。","点 (0,0) 和 (1,0) 命中，(1,1) 不命中。种子放循环外，输出位数按题意。"],"question":[{"src":"exam-images/program-918-question-1.webp","page":27,"width":1039,"height":258}],"answer":[{"src":"exam-images/program-918-answer-1.webp","page":27,"width":1039,"height":247}]},{"kind":"program","number":"919","topic":"异常分支、求平方与输出类型","notes":["输入文字转换时可能报 ValueError；合法值再计算平方。","try 内 float；失败输出指定提示。成功后可用 is_integer 使整值结果按整数显示。","测试 3、2.5、abc，检查分别是整数、小数、提示。平方所用幂运算是 **。"],"question":[{"src":"exam-images/program-919-question-1.webp","page":27,"width":1039,"height":246}],"answer":[{"src":"exam-images/program-919-answer-1.webp","page":27,"width":1039,"height":238}]},{"kind":"program","number":"921","topic":"先捕获转换异常，再算分段值","notes":["一个合法 x 应恰好匹配一个分段公式。","先尝试把输入转换成数字。按分界从小到大写 if/elif/else，算出 y 后舍入，转换失败用 except。","测试 499、500、1000、2000 和非数字，重点核对等号。"],"question":[{"src":"exam-images/program-921-question-1.webp","page":28,"width":1039,"height":427}],"answer":[{"src":"exam-images/program-921-answer-1.webp","page":28,"width":1039,"height":341}]},{"kind":"program","number":"922","topic":"三角形有效性和分类","notes":["三角形必须先成立，才能分类。","验证三条都为正，排序后看两短边和大于最长边；然后先判等边，再判等腰，其余是一般三角形。","测试三条相等、只有其中两条相等、2+3=5、带负数与坏输入。"],"question":[{"src":"exam-images/program-922-question-1.webp","page":28,"width":1039,"height":317}],"answer":[{"src":"exam-images/program-922-answer-1.webp","page":29,"width":1039,"height":390}]},{"kind":"program","number":"925","topic":"用不等式判断采样点是否在曲线下","notes":["区域命中条件来自 y 与函数值比较。","按原题区间抽样，计算该 x 对应曲线的高度；点在曲线下面就计数，面积为比例乘整个抽样矩形面积。","在 0≤x≤1 的情况，若曲线高度是 x²，估计值应接近三分之一。是否等于边界按题面。"],"question":[{"src":"exam-images/program-925-question-1.webp","page":29,"width":1039,"height":233}],"answer":[{"src":"exam-images/program-925-answer-1.webp","page":29,"width":1039,"height":254}]},{"kind":"program","number":"489","topic":"单位转换、面积比例及向上取整","notes":["圆面积比分子分母中的圆周率会约去，直径平方比也等于面积比。","先按题目给的单位换算，再按要求舍去部分；算新旧面积关系，最后用 ceil 取足够的整数数量。","确认分子是原来的总面积，分母是单个替代项的面积。向下取整可能数量不足。"],"question":[{"src":"exam-images/program-489-question-1.webp","page":30,"width":1039,"height":448},{"src":"exam-images/program-489-question-2.webp","page":30,"width":1039,"height":198}],"answer":[{"src":"exam-images/program-489-answer-1.webp","page":30,"width":1039,"height":286}]},{"kind":"program","number":"888","topic":"单位字符与浮点转换","notes":["带单位文本可拆成首字符和后面的数字。","strip 去外部空白。用第 0 个字符决定公式，把其余字符转成浮点数；打印时组合单位和指定小数位。","互换两种单位各测试一次。不要把单位一同拿去 float。"],"question":[{"src":"exam-images/program-888-question-1.webp","page":31,"width":1039,"height":456}],"answer":[{"src":"exam-images/program-888-answer-1.webp","page":31,"width":1039,"height":306}]},{"kind":"program","number":"896","topic":"用 replace 修正文字","notes":["replace 返回替换后的新字符串。","将需要修正的小写字符与替换后的大写字符按顺序传入 replace；接住新结果再打印。","检查多次出现与一次也没有这两种情况。原文本本身不就地改变。"],"question":[{"src":"exam-images/program-896-question-1.webp","page":31,"width":1039,"height":191}],"answer":[{"src":"exam-images/program-896-answer-1.webp","page":31,"width":1039,"height":214}]},{"kind":"program","number":"897","topic":"按小数点拆分并格式化","notes":["直接拆字符串比先转 float 更能保留小数部分的原始字符。","把输入按小数点拆为两段。根据题目要求决定保留 \"04\" 还是把它转成整数 4，再用模板输出。","用带前导 0 的小数部分测试，避免格式在转换时悄悄丢失。"],"question":[{"src":"exam-images/program-897-question-1.webp","page":32,"width":1039,"height":229}],"answer":[{"src":"exam-images/program-897-answer-1.webp","page":32,"width":1039,"height":237}]},{"kind":"program","number":"898","topic":"编号映射到文字","notes":["列表第一个位置下标为 0，但月份编号从 1 开始。","验证编号在 1 到 12，再按“编号减一”找月份文字，按题意加后缀。","用 1 和 12 检查首尾，能立刻发现下标少减一。"],"question":[{"src":"exam-images/program-898-question-1.webp","page":32,"width":1039,"height":210}],"answer":[{"src":"exam-images/program-898-answer-1.webp","page":32,"width":1039,"height":220}]},{"kind":"program","number":"950","topic":"检查重复键、添加和输出","notes":["in 检查字典中是否有该键，赋值可新增或覆盖。","先读键和值。若键已存在按题意提示；若不存在才赋值，然后按要求打印所有记录。","已有键要保留原来的值。像电话号码这类标识见题意，一般作为字符串保留。"],"question":[{"src":"exam-images/program-950-question-1.webp","page":33,"width":1039,"height":483},{"src":"exam-images/program-950-question-2.webp","page":33,"width":1039,"height":148}],"answer":[{"src":"exam-images/program-950-answer-1.webp","page":33,"width":1039,"height":286}]},{"kind":"program","number":"951","topic":"把字典键转成列表","notes":["keys() 给所有键的视图，list() 把它转成列表。","先取 d.keys()，再 list，最后打印。直接打印字典或字典视图会出现别的外形。","字典已有插入顺序，只按题目明确要求再排序。"],"question":[{"src":"exam-images/program-951-question-1.webp","page":34,"width":1039,"height":285}],"answer":[{"src":"exam-images/program-951-answer-1.webp","page":34,"width":1039,"height":155}]},{"kind":"program","number":"952","topic":"累加字典的值","notes":["values() 取得字典值，若要总额就累计这些数值。","累计值先置 0，遍历 values() 后每次加当前值。也可在值都是数字时直接 sum。","空字典求和为 0；原题中的格式示例不等同于数据计算结果。"],"question":[{"src":"exam-images/program-952-question-1.webp","page":34,"width":1039,"height":329}],"answer":[{"src":"exam-images/program-952-answer-1.webp","page":34,"width":1039,"height":146}]},{"kind":"program","number":"953","topic":"按字典原本的值分组计数","notes":["原字典的值可作为新计数字典的键。","逐个访问原字典 values()，用 counts.get(category,0)+1 累加，再按要求输出每个类别。","某类别出现两次，输出中应是一条计数为 2 的记录，不能覆盖成 1。"],"question":[{"src":"exam-images/program-953-question-1.webp","page":34,"width":1039,"height":474},{"src":"exam-images/program-953-question-2.webp","page":35,"width":1039,"height":62}],"answer":[{"src":"exam-images/program-953-answer-1.webp","page":35,"width":1039,"height":443}]},{"kind":"program","number":"954","topic":"分行读入再按键查询","notes":["每组输入可以对应一个键和值，查询时沿同一个方向读。","循环读取固定组数的两行键和值。循环结束读要查询的键，打印对应记录。","根据题面处理重复键与缺失键。只输出要求的字段，避免额外输入提示。"],"question":[{"src":"exam-images/program-954-question-1.webp","page":35,"width":1039,"height":424}],"answer":[{"src":"exam-images/program-954-answer-1.webp","page":35,"width":1039,"height":190}]},{"kind":"program","number":"955","topic":"去一个最大、最小再求平均","notes":["去掉一个最高分和一个最低分后，用剩余数量作分母。","先排序，截取 [1:-1]，再求平均。题目若要保留一位小数，用明确格式。","数据 [2,2,4,6] 删去两端后仍保留一个 2，均值 3。输入至少应有三项。"],"question":[{"src":"exam-images/program-955-question-1.webp","page":35,"width":1039,"height":325}],"answer":[{"src":"exam-images/program-955-answer-1.webp","page":36,"width":1039,"height":281}]},{"kind":"program","number":"956","topic":"多次输入，字典查找与提前结束","notes":["and 左侧查键为假时会跳过右侧的取值，避免缺键错误。","每轮读一对字段，存在该键且值相等才成功。按题目规定决定失败时继续还是结束；成功可立即 break。","样例和原参考对失败后是否继续的口径不完全一致。先按题面和评测样例确定要读几轮、输出几次。"],"question":[{"src":"exam-images/program-956-question-1.webp","page":36,"width":1039,"height":471},{"src":"exam-images/program-956-question-2.webp","page":36,"width":1039,"height":85}],"answer":[{"src":"exam-images/program-956-answer-1.webp","page":36,"width":1039,"height":281}]},{"kind":"program","number":"957","topic":"GBK 文本筛选记录与按格式输出","notes":["文本字段可直接比较，坐标等数值字段应先转换。","用题目指定的 GBK 打开，逐行去换行，跳过空行；按逗号解包四列，匹配时刻并转 float 比较阈值，再按原格式打印。","用“时间对但数值不对”“数值对但时间不对”“两项都对”三行检查条件是 AND。"],"question":[{"src":"exam-images/program-957-question-1.webp","page":37,"width":1039,"height":321}],"answer":[{"src":"exam-images/program-957-answer-1.webp","page":37,"width":1039,"height":280}]},{"kind":"program","number":"958","topic":"UTF-8 CSV 按月份汇总排名","notes":["先把全部合格销量加到对应产品，最终排名才有意义。","UTF-8 读 CSV，跳过表头，再拆日期取月份。范围内才累积数量；读完排序并取前五。","同一产品多行必须合计。只有表头时应无输出且不报错；参考代码若只在循环中给排序结果赋值，空数据会出错。 题面是 6 到 10 月，筛选条件写 6 \u003c= month \u003c= 10。题库参考代码写成 6 \u003c month，漏掉了 6 月。"],"question":[{"src":"exam-images/program-958-question-1.webp","page":37,"width":1039,"height":420}],"answer":[{"src":"exam-images/program-958-answer-1.webp","page":38,"width":1039,"height":423}]}]</script>
<script src="choice-learning.js"></script>
<script src="quick-study.js"></script>
<script>
const select = id => document.getElementById(id);
const questions = JSON.parse(select("exam-data").textContent);
const byNumber = new Map(questions.map(item => [item.number, item]));
const detailedChoices = new Map();
const chapterFor = new Map();
const choices = CHOICE_LEARNING.map(chapter => ({
  title: chapter.title,
  items: chapter.lessons.flatMap(lesson => lesson.numbers.map(number => {
    detailedChoices.set(number, {syntax: lesson.first, steps: lesson.steps});
    return byNumber.get(number);
  })),
}));
const programs = PROGRAM_TOPICS.map(chapter => ({
  title: chapter.title,
  items: chapter.items.map(number => byNumber.get(number)),
}));
const repeated = {...REPEATED_CHOICE, ...REPEATED_PROGRAM};
const chapterLists = {
  choice: makeQuickChapters(choices),
  program: makeQuickChapters(programs),
};
const banks = {
  quick: {
    choice: chapterLists.choice.flatMap(chapter => chapter.items),
    program: chapterLists.program.flatMap(chapter => chapter.items),
  },
  all: {
    choice: questions.filter(item => item.kind === "choice"),
    program: questions.filter(item => item.kind === "program"),
  },
};
const bankButtons = document.querySelectorAll("[data-bank]");
const modeButtons = document.querySelectorAll("[data-mode]");
const chapterPicker = select("chapter");
const pick = select("pick");
const title = select("title");
const analysis = select("analysis");
const reference = select("reference");
const answer = select("answer");
const example = select("example");
const previous = select("previous");
const next = select("next");
let mode = "quick";
let active = banks.quick.choice[0];
let renderedList = "";

function makeQuickChapters(chapters) {
  return chapters.map(chapter => {
    const items = chapter.items.filter(item => !Object.hasOwn(repeated, item.number));
    for (const item of items) chapterFor.set(item.number, chapter);
    return {title: chapter.title, items};
  }).filter(chapter => chapter.items.length);
}

function titleOf(item) {
  if (item.kind === "program") return "程序题 " + item.number;
  if (item.number.startsWith("附")) return "附加选择题第 " + item.number.slice(1) + " 题";
  return "选择题第 " + item.number + " 题";
}

function figures(blocks, item, solution = false) {
  return blocks.map((block, index) => {
    const panel = document.createElement("div");
    panel.className = "figure " + item.kind;
    const link = document.createElement("a");
    link.href = block.src;
    link.target = "_blank";
    link.rel = "noopener";
    const img = document.createElement("img");
    img.src = block.src;
    img.width = block.width;
    img.height = block.height;
    img.alt = block.text || titleOf(item) + (solution ? " 参考代码" : " 原题") + "第 " + (index + 1) + " 部分";
    link.append(img);
    panel.append(link);
    return panel;
  });
}

function addFormattedText(element, text) {
  element.replaceChildren();
  text.split("§").forEach((part, index) => {
    if (index % 2 === 0) {
      element.append(part);
      return;
    }
    const code = document.createElement("code");
    code.textContent = part;
    element.append(code);
  });
}


function showExplanation(item) {
  const explanation = item.kind === "choice"
    ? QUICK_CHOICE[item.number] ?? detailedChoices.get(item.number)
    : QUICK_PROGRAM[item.number];
  addFormattedText(select("prerequisite"), explanation.syntax);
  const isProgram = item.kind === "program";
  select("reasoning-label").textContent = isProgram ? "怎么写" : "怎么判断";
  select("reasoning").replaceChildren(...explanation.steps.map(step => {
    const line = document.createElement("p");
    addFormattedText(line, step);
    return line;
  }));
  const sample = isProgram ? PROGRAM_EXAMPLES[item.number] : null;
  example.open = false;
  example.hidden = !sample;
  if (sample) {
    select("example-code").textContent = sample.code;
    select("example-input").hidden = !sample.input;
    select("example-input").textContent = sample.input ? "输入  " + sample.input : "";
    select("example-output").textContent = "输出  " + sample.output;
  }
}

function render(item, moveFocus = false) {
  const {kind, number} = item;
  const bank = banks[mode][kind];
  const index = bank.indexOf(item);
  const chapters = chapterLists[kind];
  const currentChapter = chapterFor.get(number);
  const chapterIndex = chapters.findIndex(chapter => chapter.title === currentChapter?.title);
  const listKey = [mode, kind, chapterIndex].join("/");
  if (renderedList !== listKey) {
    const listed = mode === "quick" ? chapters[chapterIndex].items : bank;
    pick.replaceChildren(...listed.map(entry => new Option(titleOf(entry), entry.number)));
    chapterPicker.replaceChildren(...chapters.map((chapter, i) => new Option(chapter.title, String(i))));
    renderedList = listKey;
  }
  chapterPicker.value = String(chapterIndex);
  select("learning-path").hidden = mode === "all";
  for (const button of bankButtons) {
    const bankKind = button.dataset.bank;
    button.setAttribute("aria-pressed", String(bankKind === kind));
    const label = bankKind === "choice" ? "选择题" : "程序题";
    button.textContent = label + " · " + banks[mode][bankKind].length + " 道";
  }
  for (const button of modeButtons) button.setAttribute("aria-pressed", String(button.dataset.mode === mode));

  active = item;
  pick.value = number;
  title.textContent = titleOf(item);
  select("topic").textContent = item.topic;
  select("counter").textContent = (index + 1) + " / " + bank.length;
  select("question").replaceChildren(...figures(item.question, item));
  const replacement = Object.hasOwn(repeated, number) ? byNumber.get(repeated[number]) : null;
  select("repeat-note").hidden = !replacement;
  if (replacement) select("repeat-target").textContent = titleOf(replacement);

  analysis.open = false;
  reference.open = false;
  reference.hidden = item.answer.length === 0;
  answer.replaceChildren();
  const sourceMark = select("source-mark");
  sourceMark.hidden = !item.marked?.length;
  sourceMark.textContent = item.marked?.length ? "题库参考答案 " + item.marked.join("、") : "";
  showExplanation(item);

  previous.disabled = index === 0;
  next.disabled = index === bank.length - 1;
  select("jump-error").textContent = "";
  if (moveFocus) {
    title.focus({preventScroll:true});
    title.scrollIntoView({block:"start"});
  }
}

function move(offset) {
  const bank = banks[mode][active.kind];
  const item = bank[bank.indexOf(active) + offset];
  if (item) render(item, true);
}

function openNumber(number, moveFocus = false) {
  const item = byNumber.get(number);
  if (!item) return false;
  if (Object.hasOwn(repeated, number)) mode = "all";
  render(item, moveFocus);
  return true;
}

for (const button of bankButtons) {
  button.addEventListener("click", () => {
    if (active.kind !== button.dataset.bank) render(banks[mode][button.dataset.bank][0]);
  });
}
for (const button of modeButtons) {
  button.addEventListener("click", () => {
    if (mode === button.dataset.mode) return;
    mode = button.dataset.mode;
    const number = mode === "quick" && Object.hasOwn(repeated, active.number)
      ? repeated[active.number] : active.number;
    openNumber(number);
  });
}
select("repeat-target").addEventListener("click", () => {
  mode = "quick";
  openNumber(repeated[active.number], true);
});
previous.addEventListener("click", () => move(-1));
next.addEventListener("click", () => move(1));
chapterPicker.addEventListener("change", () => render(chapterLists[active.kind][Number(chapterPicker.value)].items[0], true));
pick.addEventListener("change", () => openNumber(pick.value, true));
select("jump").addEventListener("submit", event => {
  event.preventDefault();
  const query = select("number").value.trim().replace(/\s+/g, "").replace(/^附(?:加)?(?:选择题)?(?:第)?/, "附").replace(/^(?:选择题|程序题)?第?/, "").replace(/题$/, "");
  if (!openNumber(query, true)) select("jump-error").textContent = "找不到这个题号。附加选择题可以输入「附1」到「附10」。";
});
reference.addEventListener("toggle", () => {
  if (reference.open && !answer.childElementCount) answer.replaceChildren(...figures(active.answer, active, true));
});
if (!openNumber(new URLSearchParams(location.search).get("q"))) render(active);
</script>
</body>
